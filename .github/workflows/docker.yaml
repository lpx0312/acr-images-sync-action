name: Docker

# 仅由后端平台通过 workflow_dispatch 触发；
# 目标仓库地址 / 命名空间 / 用户名 / 密码全部由 dispatch inputs 传入，
# 本仓库不配置任何 vars/secrets 形式的目标仓库信息。
# vars/secrets 只保留源镜像仓库（Docker Hub / ghcr.io / quay.io）的拉取凭据，
# 仅用于拉取侧加速与私有源镜像，与推送目标无关。
on:
  workflow_dispatch:
    inputs:
      registry:
        description: '目标镜像仓库地址'
        required: true
      namespace:
        description: '目标命名空间'
        required: true
      registry_user:
        description: '目标镜像仓库用户名'
        required: true
      registry_password:
        description: '目标镜像仓库密码'
        required: true

env:
  TARGET_REGISTRY: "${{ github.event.inputs.registry }}"
  TARGET_NAMESPACE: "${{ github.event.inputs.namespace }}"
  TARGET_USER: "${{ github.event.inputs.registry_user }}"
  TARGET_PASSWORD: "${{ github.event.inputs.registry_password }}"
  # 源镜像仓库拉取凭据（可选）：未配置则匿名拉取公共镜像
  DOCKERHUB_USERNAME: "${{ vars.DOCKERHUB_USERNAME }}"
  DOCKERHUB_PASSWORD: "${{ secrets.DOCKERHUB_PASSWORD }}"
  GHCR_USERNAME: "${{ vars.GHCR_USERNAME }}"
  GHCR_TOKEN: "${{ secrets.GHCR_TOKEN }}"
  QUAY_USERNAME: "${{ vars.QUAY_USERNAME }}"
  QUAY_PASSWORD: "${{ secrets.QUAY_PASSWORD }}"

jobs:
  build:
    name: Pull
    runs-on: ubuntu-latest
    # 兜底：跨境推送 ~700MB/架构在 PUSH_TIMEOUT=1800s 预算下，
    # 单镜像双架构一次尝试约 70 分钟，留一次重试余量
    timeout-minutes: 150
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install skopeo v1.22.0
      run: |
        wget https://github.com/lework/skopeo-binary/releases/download/v1.22.0/skopeo-linux-amd64
        chmod +x skopeo-linux-amd64
        sudo mv skopeo-linux-amd64 /usr/bin/skopeo
        skopeo --version

    - name: Install manifest-tool
      run: |
        wget https://github.com/estesp/manifest-tool/releases/download/v2.2.1/binaries-manifest-tool-2.2.1.tar.gz
        tar -zxf binaries-manifest-tool-2.2.1.tar.gz
        chmod +x manifest-tool-linux-amd64
        sudo mv manifest-tool-linux-amd64 /usr/local/bin/manifest-tool

    - name: Sync images using Skopeo (Python Fast Sync)
      run: python3 .github/scripts/sync.py
